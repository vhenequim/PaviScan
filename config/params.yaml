detector: classico          # classico | yolo (futuro)

tiles:
  tamanho_px: 1024
  sobreposicao_px: 128
  sobreposicao_min_m: 4.0   # a sobreposicao nunca fica menor que isto; a janela cresce se preciso
  margem_emenda_m: 1.0      # a menos disto da borda interna da janela o detector perde contexto.
                            # objeto de ate (sobreposicao - 2 x margem) = 2 m sai inteiro de alguma
                            # janela; maior que isso pode sair truncado e e marcado como na_emenda
  duplicata_min: 0.2        # mesma deteccao em duas janelas: intersecao >= esta fracao da menor

classico:
  janela_fundo_m: 2.0       # maior que o maior buraco esperado
  k_mad: 6.0                # limiar = mediana + k x MAD da anomalia
  contraste_min: 18         # piso do limiar, em niveis de cinza
  area_min_m2: 0.05
  area_max_m2: 10.0         # acima de ~2 m nas duas dimensoes (janela_fundo_m) a medida e instavel
  solidez_min: 0.6
  alongamento_max: 4.0
  suavizacao_m: 0.01        # desfoque gaussiano antes de tudo
  margem_borda_m: 0.15      # faixa ignorada junto a borda da pista
  morfologia_m: 0.03        # elemento da abertura e do fechamento
  fundo_res_m: 0.10         # resolucao em que o fundo local e estimado
  fundo_percentil: 50       # 50 = mediana local
  borda_nitida_m: 0.04      # transicao ate aqui conta como borda nitida (confianca cheia)
  borda_suave_m: 0.30       # transicao a partir daqui conta como borda suave (sombra, mancha)
  contraste_cheio: 3.0      # contraste, em multiplos do limiar, que da confianca cheia
  solidez_cheia: 0.92       # solidez a partir da qual a forma da confianca cheia
  croma_max: 40             # max - min dos canais RGB; acima disso o pixel nao e asfalto
  separacao_nucleo: 0.6     # watershed: nucleo = distancia a borda >= esta fracao da maior da regiao
  terra_croma_min: 60       # via de terra: pixel com max - min dos canais a partir disto tem cor forte de solo
  terra_fracao_min: 0.5     # ... e a janela e tratada como via de terra se essa fracao da pista for assim
  solo_exposto: true        # segunda passada: revestimento perdido (cor de solo no meio do pavimento)
  solo_contraste_min: 30    # contraste minimo da segunda passada, no sinal (peso x cinza + R - B)
  solo_peso_brilho: 0.5     # peso do brilho no sinal de solo; o resto e a cor (R - B)
  solo_k_mad: 0             # sem o termo k x MAD: dano extenso nao e raro na imagem
  solo_quente_min: 15       # R - B minimo do pixel: pintura e concreto claros, sem cor, nao entram
  solo_matiz_max: 42        # matiz maximo em graus: solo vai do vermelho ao laranja; pintura amarela passa disso
  exg_max: 20               # 2G - R - B acima disto e vegetacao e fica fora da segunda passada
  solo_sobreposicao_max: 0.5  # regiao ja marcada como buraco nao entra de novo como solo exposto
  sombra_quente_max: 8      # sombra: R - B ate isto (sem cor quente) ...
  sombra_fracao_brilho: 0.6 # ... e brilho ate esta fracao do pavimento claro da janela
  sombra_percentil_claro: 90  # "pavimento claro" = este percentil do brilho da pista na janela
  solo_janela_fundo_m: 6.0  # o revestimento perdido forma faixas largas: janela de fundo maior
  solo_fundo_percentil: 80  # fundo = pavimento mais "frio" da janela (basta 20 % de pavimento inteiro)

severidade:                 # por area do buraco, em m2. Faixas de trabalho, nao sao de norma
  media_a_partir_de: 0.25
  alta_a_partir_de: 1.0

contorno:                   # contorno do defeito com menos vertices; a area medida nos pixels fica
  tolerancia_min_m: 0.03    # simplificacao minima: tira o serrilhado dos pixels
  tolerancia_rel: 0.03      # mais esta fracao do lado equivalente (raiz da area), em defeito grande
  variacao_area_max: 0.2    # parte cuja area mudaria mais que isso (forma fina) fica so sem o serrilhado

segmentos:
  comprimento_m: 20
  resto_min_m: 5            # sobra menor que isto no fim do trecho entra no ultimo segmento
  pedaco_min_m2: 0.05       # regiao extensa repartida por segmento: pedaco menor que isto e descartado

raster:
  percentil_branco: 99.5    # raster que nao e uint8: este percentil vira 255, igual na imagem toda
  amostra_px: 1024          # lado da amostra reduzida em que o percentil e medido

pista:
  res_recorte_m: 0.25       # resolucao em que a area com dado da ortofoto e medida para recortar a pista
  aviso_sobreposicao: 0.01  # avisa quando trechos sobrepostos passam desta fracao da area da pista

moldura:                    # ortofoto gravada sem mascara: moldura lisa ligada aos cantos nao e dado
  branco_min: 250
  preto_max: 5
  tolerancia: 4
  franja_px: 2              # franja da reprojecao em volta da area sem dado, na previa

previa:
  largura_max_px: 4000

recortes:                   # miniatura de cada buraco para conferencia no painel
  margem_m: 1.5
  lado_min_m: 4.0
  lado_px: 360
  maximo: 600

pista_osm:                  # pista automatica: eixos do OpenStreetMap + cor do asfalto
  classes: [motorway, trunk, primary, secondary, tertiary, unclassified, residential, living_street,
            service, track]  # service e track: ruas internas de quartel, condominio e estrada de terra
  meia_largura_m:           # corredor em volta do eixo; a cor do asfalto define a borda real
    padrao: 3.4
    desenhado: 4.0          # eixo desenhado pelo usuario
    primary: 6.5
    secondary: 5.5
    tertiary: 4.5
    service: 3.0
    track: 2.5
  res_m: 0.15               # resolucao da mascara de asfalto
  faixa_referencia_m: 1.0   # meia largura da faixa no eixo onde o brilho do asfalto e medido
  pixels_referencia_min: 20 # com menos pixels cinzentos que isto no eixo, o trecho e ignorado
  saturacao_max: 0.22       # asfalto e cinza: saturacao HSV baixa (0 a 1)
  cobertura_asfalto_min: 0.3  # superficie "auto": com menos que isto do corredor em cor de asfalto, a via e de terra
  exg_max: 20               # superficie "terra": 2G - R - B ate isto nao e vegetacao
  brilho_claro: 0.72        # superficie "terra": mais claro que isto e sem cor e telhado ou concreto
  tolerancia_brilho: 0.13   # desvio de brilho HSV aceito em torno do asfalto do eixo (0 a 1)
  limpeza_m: 0.45           # abertura que solta calcada e ruido
  buraco_max_m2: 4.0        # furo interno menor que isto volta a ser pista (buraco, bueiro, pintura)
  dobra_max_graus: 30       # o eixo e partido em trechos retos nas curvas maiores que isto
  trecho_min_m: 12
  area_min_m2: 15

orcamento:                  # precos em config/precos.csv, solucoes em config/solucoes.csv
  pavimento: CBUQ           # CBUQ | PMF | TSD
  terreno: regular          # bom | regular | ruim
  bdi: 0.25                 # entra so no total
  margem_corte_m: 0.30      # folga do retangulo de corte em volta do defeito
  corte_pela_area: [solo_exposto]   # classes extensas: corte = area x folga_area, nao retangulo
  folga_area: 1.2
  limite_recapeamento: 0.15 # fracao do segmento em area de corte que dispara a opcao C
  plano:                    # solucao recomendada por classe e severidade (A ou B)
    panela: {baixa: A, media: A, alta: B}
    solo_exposto: {baixa: B, media: B, alta: B}

condicao:                   # indice de condicao de 0 a 100. E de trabalho: nao e IGG nem ICP de norma
  peso_area: 8.0            # pontos perdidos por 1 % de area afetada
  peso_densidade: 1.0       # pontos perdidos por defeito a cada 100 m
  so_area: [solo_exposto]   # classes extensas contam so pela area: seus pedacos nao entram na densidade
  conceitos: {A: 85, B: 70, C: 50, D: 30}   # nota minima de cada conceito; abaixo de D e E

revisao:                    # editor de contorno da aba Inspecao
  vertices_max: 30          # contorno e simplificado ate este numero de vertices para editar
  janela_px: 1200           # lado maximo da imagem em resolucao cheia mostrada no editor
  reancorar_iou_min: 0.5    # ao reprocessar, a revisao passa ao defeito novo com esta sobreposicao

acervo:
  pasta_imagens: dados      # ortofotos enviadas pelo painel: uma pasta por imagem (orto.tif, pista, eixo)
  previa_lado_px: 1400      # previa rapida usada na tela de entrada
  gsd_aviso_cm: 5           # acima disto a tela avisa que buraco pequeno fica invisivel
